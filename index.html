<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="description" content="国际货运单号查询，实时追踪包裹轨迹。">
<meta property="og:type" content="website">
<meta property="og:title" content="国际货运 - 在线查件系统">
<meta property="og:description" content="国际货运单号查询，实时追踪包裹轨迹。">
<title>国际货运 - 在线查件系统</title>
<style>
:root{
  --blue:#0074cc;--blue-deep:#005ba1;--blue-link:#0065b8;--blue-hover:#004a85;
  --red:#d03030;--green:#00b42a;--orange:#ff7d00;
  --bg:#f7f7f7;--card:#fff;--border:#e5e7eb;--text:#333;
}
*{box-sizing:border-box;font-family:"Microsoft Yahei","PingFang SC",sans-serif;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{min-height:100vh;padding:15px 12px;background:var(--bg);}
.container{max-width:600px;margin:0 auto;}
.card{background:var(--card);border-radius:10px;padding:14px;box-shadow:0 1px 10px rgba(0,0,0,.08);margin-bottom:8px;}
.page-header{text-align:center;margin-bottom:8px;}
.page-header h1{color:#222;font-size:24px;margin-bottom:4px;}
.page-header .tip-text{font-size:28px;color:var(--red);font-weight:800;letter-spacing:2px;}
.nav-bar{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 20px;margin-bottom:8px;}
@media(min-width:601px){.nav-bar{gap:10px;padding:0 4px;}}
.nav-item{display:flex;align-items:center;justify-content:center;gap:4px;height:34px;background:#fff;border-radius:999px;color:var(--blue-link);font-size:14px;font-weight:600;cursor:pointer;border:1px solid #eaf4ff;box-shadow:0 2px 8px rgba(0,116,204,.12),0 1px 2px rgba(0,116,204,.08);transition:.15s ease;}
.nav-item:active{transform:scale(.97);}
.nav-item svg{width:14px;height:14px;flex-shrink:0;}
.input-pill{width:100%;height:48px;border-radius:8px;border:1px solid var(--blue);padding:0 8px 0 40px;font-size:20px;outline:none;transition:.2s;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%230074cc' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='7'/><path d='m20 20-3.5-3.5'/></svg>") no-repeat left 14px center;background-size:18px;}
.input-pill::placeholder{font-size:16px;color:#999;}
.input-pill:focus{border-color:var(--blue-deep);box-shadow:0 0 0 3px rgba(0,116,204,.18);background-image:none;padding-left:12px;}
.input-pill:not(:placeholder-shown){background-image:none;padding:0 8px 0 12px;}
.btn-row{display:flex;gap:14px;margin-top:16px;}
.btn-row button{padding:14px 0;font-size:18px;border:none;color:#fff;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.12);transition:transform .14s ease,opacity .2s;}
.btn-row button:active{transform:scale(.96);opacity:.9;}
.btn-reset{background:#ff4444;flex:0 0 90px;}
.btn-query{background:var(--blue);flex:1;}
.result-box{margin-top:14px;border:1px solid #ddd;background:#fff;padding:12px 14px;min-height:70px;display:none;border-radius:6px;font-size:15px;}
.result-box h3{margin-bottom:12px;color:var(--blue);}
.loading-tip{text-align:center;padding:14px 0;color:var(--blue);font-size:16px;}
.ship-card{padding:0;margin-bottom:16px;background:transparent;}
.ship-head{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;padding-top:12px;border-top:1px solid var(--border);align-items:center;}
.status-tag{padding:4px 10px;border-radius:4px;color:#fff;font-weight:bold;}
.tag-delivered{background:var(--green);}
.tag-transit{background:var(--orange);}
.tip-faint{font-size:14px;color:#999;font-weight:normal;margin-left:6px;}
.info-row{display:flex;align-items:center;margin:6px 0;gap:8px;}
.info-label{color:#666;flex-shrink:0;width:64px;white-space:nowrap;}
.text-plain{color:#000;font-weight:normal;white-space:nowrap;cursor:default;}
.carrier-no{display:inline-block;color:var(--blue);font-weight:bold;white-space:nowrap;}
.carrier-no .carrier-link,.carrier-no .carrier-num{color:var(--blue);text-decoration:underline;cursor:pointer;}
.blur-no{filter:blur(5px);-webkit-filter:blur(5px);user-select:none;cursor:pointer;transition:filter .18s ease;}
.blur-no:hover,.blur-no.show{filter:none;-webkit-filter:none;user-select:auto;}
.toggle-track{margin-top:8px;color:var(--blue);cursor:pointer;user-select:none;display:block;}
.track-full{display:none;}
.track-preview{margin-bottom:0;}
.timeline-item{padding:8px 0 8px 12px;border-left:2px solid #dcdcdc;position:relative;margin-left:4px;}
.track-time{font-size:13px;color:#888;margin-bottom:3px;}
.track-desc{font-size:14px;color:var(--text);}
.service-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;text-align:center;}
.slogan-img{width:100%;height:auto;display:block;margin:4px 0 0;border-radius:8px;object-fit:contain;background:#fff;}
.service-tag{font-size:14px;color:var(--blue-deep);background:linear-gradient(180deg,#eaf4ff,#cfe6ff);border:1px solid #b4d4f5;font-weight:600;box-shadow:0 2px 4px rgba(0,116,204,.12),inset 0 1px 0 rgba(255,255,255,.6);cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:999px;padding:8px 2px;transition:transform .14s ease;}
.service-tag:active{transform:scale(.94);}
.service-text{font-size:15px;color:#000;line-height:1.8;text-wrap:pretty;margin:0;}
.service-text strong{font-weight:600;color:#222;font-size:17px;}
.divider{height:1px;background:#e5e5e5;margin:0 auto;width:90%;}
#contactCard .contact-info{margin-bottom:8px;}
#contactCard .qrcode-box{margin-top:12px;}
.contact-info{text-align:center;font-size:17px;font-weight:bold;color:#000;line-height:1.9;margin-bottom:10px;}
.qrcode-box{width:180px;height:180px;border:2px dashed #999;margin:14px auto 6px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:8px;overflow:hidden;position:relative;}
.qrcode-box img{width:98%;height:98%;object-fit:contain;}
.qrcode-box img.overlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;}
.qr-desc{text-align:center;font-size:14px;color:#666;margin-bottom:10px;}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;opacity:0;transition:.24s ease;align-items:center;justify-content:center;}
.modal-mask.show{display:flex;opacity:1;}
.modal-mask.contact{align-items:flex-end;}
.modal{width:100%;max-width:520px;background:#fff;border-radius:14px;box-shadow:0 4px 30px rgba(0,0,0,.15);transform:translateY(20px);transition:.24s ease;overflow:hidden;}
.modal.contact{border-radius:14px 14px 0 0;max-width:600px;}
.modal-header{padding:16px 18px;border-bottom:1px solid #eee;background:#fbfcfe;}
.modal-top-bar{display:flex;justify-content:space-between;align-items:center;margin:0;}
.modal-title{font-size:20px;color:#222;font-weight:600;}
.modal-close{font-size:28px;color:#999;cursor:pointer;line-height:1;transition:.2s;}
.modal-close:hover{color:#333;}
.history-clear{width:100%;background:#ff3333;text-align:center;padding:9px 0;border-radius:8px;margin-top:12px;color:#fff;cursor:pointer;font-size:15px;}
.history-clear:active{opacity:.8;}
.history-item{padding:9px 18px;border-bottom:1px solid #f0f2f7;cursor:pointer;height:72px;display:flex;flex-direction:column;justify-content:center;transition:.2s;}
.history-item:hover{background:#f7faff;}
.history-list{max-height:360px;overflow-y:auto;background:#fff;}
.history-list::-webkit-scrollbar{width:6px;}
.history-list::-webkit-scrollbar-track{background:#f5f7fa;}
.history-list::-webkit-scrollbar-thumb{background:#c2c9d6;border-radius:3px;}
.history-time{font-size:13px;color:#808896;margin-bottom:3px;}
.history-no{font-size:19px;color:var(--blue-link);font-weight:500;}
.history-empty{text-align:center;padding:40px 20px;font-size:15px;color:#888;height:360px;display:flex;align-items:center;justify-content:center;}
.contact-body{padding:18px;max-height:70vh;overflow-y:auto;}
.toast-layer{position:fixed;top:40%;left:0;right:0;transform:translateY(-50%);z-index:999;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:10px;}
.toast-item{padding:10px 18px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;font-size:15px;opacity:0;transform:translateY(20px);transition:.25s;}
@media(max-width:360px){
body{padding:12px 10px;}
.page-header h1{font-size:22px;}
.page-header .tip-text{font-size:24px;}
.card{padding:12px;margin-bottom:6px;}
.btn-row button{font-size:16px;padding:12px 0;}
.service-tag{font-size:13px;padding:7px 2px;}
.service-text{font-size:14px;}
.contact-info{font-size:15px;}
.qrcode-box{width:150px;height:150px;margin:12px auto 4px;}
.modal-title{font-size:18px;}
.history-time{font-size:11px;}
.history-no{font-size:16px;}
.history-empty{font-size:13px;height:320px;}
.nav-item{min-width:100px;}
.input-pill{font-size:18px;padding:0 6px 0 38px;}
.input-pill::placeholder{font-size:15px;}
.history-item{height:64px;padding:7px 18px;}
.history-list{max-height:320px;}
}
#phoneCard{display:flex;flex-direction:column;gap:6px;padding:12px;}
#phoneCard .contact-info{margin:0;line-height:1.6;}
#phoneCard .service-text{margin:0;}
#contactCard{padding:12px;}
.track-official{cursor:pointer;border-left-color:var(--blue);background:linear-gradient(90deg,#eaf4ff,#f7fbff);border-radius:0 6px 6px 0;margin-left:4px;transition:.15s;}
.track-official:active{transform:scale(.99);background:linear-gradient(90deg,#d6e9ff,#eef6ff);}
.track-desc-official{font-size:14px;color:var(--blue);font-weight:600;}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
const EL={
    orderInput:$('orderInput'),queryBtn:$('queryBtn'),resetBtn:$('resetBtn'),resultBox:$('resultBox'),
    toastLayer:$('toastLayer'),serviceCard:$('serviceCard'),contactJumpBtn:$('contactJumpBtn'),
    historyBtn:$('historyBtn'),historyMask:$('historyMask'),historyListWrap:$('historyListWrap'),
    closeHistory:$('closeHistory'),clearAllHistory:$('clearAllHistory'),
    contactMask:$('contactMask'),closeContact:$('closeContact')
};
const CFG={
    MAX_ROWS:10,MAX_TOAST:5,TOAST_TIME:1200,MAX_HISTORY:10,HISTORY_KEY:"track_query_history",MIN_INTERVAL:800,
    PROXY_LIST:[
        "https://hy5118.netlify.app/.netlify/functions/trackProxy",
        "https://hy5118.onrender.com/track"
    ],
    API_ENCRYPT:[
        "aHR0cHM6Ly90cmFja2luZy5uZXh0c2xzLmNvbS9yZXN0L3RyYWNlL3RyYWNraW5nL2xpc3RzP2FwcD02NTZkOTJmNTczZjA0MjdlOGU1Y2E1MzYmbnVtYmVyPQ==",

    ]
};
let toastQueue=[],querying=false,lastQuery=0,abortCtrl=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const openModal=m=>m.classList.add('show');
const closeModal=m=>m.classList.remove('show');
const showToast=msg=>{
    if(toastQueue.length>=CFG.MAX_TOAST)toastQueue.shift().remove();
    const t=Object.assign(document.createElement('div'),{className:'toast-item',innerText:msg});
    EL.toastLayer.appendChild(t);toastQueue.push(t);
    requestAnimationFrame(()=>{t.style.opacity='1';t.style.transform='translateY(0)';});
    setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(20px)';setTimeout(()=>{toastQueue=toastQueue.filter(x=>x!==t);t.remove();},250);},CFG.TOAST_TIME);
};
const copyTransNo=async no=>{await navigator.clipboard.writeText(no.split(' ').pop());showToast("转运单号复制成功");};
// 点击“点击进入查询提取后物流轨迹”时：复制转运单号并统一跳转到 17track 查询页
const gotoOfficial=async no=>{
    const n=(no||'').replace(/\s+/g,'').toUpperCase();
    if(!n){showToast('单号缺失，无法跳转');return;}
    const url='https://t.17track.net/zh-cn/tracking?nums='+encodeURIComponent(n);
    try{await navigator.clipboard.writeText(n);showToast('转运单号已复制：'+n);}catch(e){showToast('单号：'+n);}
    window.open(url,'_blank','noopener');
};
const getCarrier=no=>{
    const n=(no||'').replace(/\s+/g,'').toUpperCase();
    if(!n)return null;
    const q=encodeURIComponent(n);
    if(/^1Z/.test(n))return {name:'UPS',url:'https://www.ups.com/cn/zh/Tracking/TrackingDetails?tracknum='+q};
    if(/DE$/.test(n)||/^CH/.test(n)||/^JVGL/.test(n)||/^GM/.test(n))return {name:'DHL',url:'https://www.dhl.com/cn-zh/home/tracking.html?tracking-id='+q};
    if(/^\d{12}$/.test(n))return {name:'FedEx',url:'https://www.fedex.com.cn/zh-cn/tracking.html?trackingnumber='+q};
    return null;
};
const normShip=(s,inputNo)=>({
    inputNo,transNo:s.outer_carrier_tracking_number||"",country:s.country||"",postcode:s.postcode||"",
    status:s.status==="delivered"?"delivered":"transit",statusText:s.status==="delivered"?"已签收":"运输中",
    parcelCount:(s.parcel_count||s.parcel_count===0)?s.parcel_count:null,
    traces:(s.traces||[]).map(t=>({time:t.time||"",info:t.info||"",location:""})),subOrders:[]
});
const firstValid=promises=>new Promise(resolve=>{
    let pending=promises.length;
    if(!pending)return resolve(null);
    promises.forEach(p=>Promise.resolve(p).then(r=>{if(r)resolve(r);else if(--pending===0)resolve(null);}));
});
const mkFetch=(url,opt,ms)=>{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),ms);
    if(abortCtrl)abortCtrl.signal.addEventListener('abort',()=>ctrl.abort());
    return fetch(url,{...opt,signal:ctrl.signal}).finally(()=>clearTimeout(timer));
};
const getTrack=async num=>{
    const tasks=[];
    for(const b64 of CFG.API_ENCRYPT){
        tasks.push(mkFetch(atob(b64)+encodeURIComponent(num),{},7000)
            .then(r=>r.ok?r.json():null)
            .then(j=>(j?.status===1&&j?.data?.shipment)?normShip(j.data.shipment,num):null).catch(()=>null));
    }
    for(const url of CFG.PROXY_LIST){
        // 轮询代理谁快用谁；件数/邮编由后端返回轨迹时自动附带为 parcelCount/postcode 字段
        tasks.push(mkFetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({trackNo:num})},15000)
            .then(r=>r.ok?r.json():null)
            .then(j=>(j.code===0&&j.data&&!Array.isArray(j.data))?j.data:null).catch(()=>null));
    }
    return firstValid(tasks);
};
const trackItem=(time,info)=>`<div class="timeline-item"><div class="track-time">${esc(time)}</div><div class="track-desc">${esc(info)}</div></div>`;
// 包裹件数不再读取真实值：1-2 件约70%，3-5 件约26%，5-8 件稀有（约4%，100次约3-5次）
const randParcels=()=>{
    const r=Math.random();
    if(r<0.04)return 5+Math.floor(Math.random()*4); // 5-8 件，约4%
    if(r<0.30)return 3+Math.floor(Math.random()*3); // 3-5 件，约26%
    return Math.random()<0.5?1:2; // 1-2 件，约70%
};
const renderShip=(d,queryNo)=>{
    const isSingle=window._qcount===1;
    const inputNo=d.inputNo||queryNo,transNo=d.transNo||"",sort=[...(d.traces||[])].sort((a,b)=>new Date(b.time)-new Date(a.time));
    // 仅去除“在17网或官网查询提取信息为准”等占位后缀，保留真实轨迹文字；并检测是否需显示官网查询入口
    const PLACEHOLDER_PATTERNS=[
        '在17网或官网查询提取信息为准','17网或官网查询提取信息为准','在17网查询提取信息为准',
        '或官网查询提取信息为准','官网查询提取信息为准','在17网或官网查询','17网或官网查询',
        '在17网查询','或官网查询','官网查询'
    ];
    const stripPlaceholder=info=>{
        let s=info||'';
        for(const p of PLACEHOLDER_PATTERNS)s=s.split(p).join('');
        return s.replace(/\s{2,}/g,' ').replace(/^\s+|\s+$/g,'');
    };
    const hasPh=t=>PLACEHOLDER_PATTERNS.some(p=>(t.info||'').includes(p));
    const realTraces=sort.map(t=>({...t,info:stripPlaceholder(t.info)})).filter(t=>t.info);
    const STATUS_TRIGGERS=['（包裹已陆续提取）','（放行包裹已陆续提取）','已交仓，请留意签收','Packages have been picked up'];
    const hadPlaceholder=sort.some(t=>hasPh(t)||STATUS_TRIGGERS.some(p=>(t.info||'').includes(p)));
    const transPure=(transNo||'').split(' ').pop();
    const jumpNo=(transPure||queryNo||d.inputNo||'').replace(/\s+/g,'');
    const statusClass=d.status==="delivered"?"tag-delivered":"tag-transit";
    const statusText=d.statusText||"运输中";
    const tid=queryNo+'_'+realTraces.length+(hadPlaceholder?'o':'');
    let countryText=d.country||"";
    let destLine=`<span>${esc(countryText)}</span>`;
    const parcelCount=randParcels();
    destLine+=` <span style="margin-left:12px;color:#333;">包裹：${parcelCount}件</span>`;
    let transHtml='<span>无</span>';
    let queryNoHtml='<span>无</span>';
    if(transNo){
        const parts=transNo.split(' ');
        const pure=parts.length>1?parts.pop():transNo;
        const carrier=getCarrier(pure);
        const label=carrier?carrier.name:(parts.length>1?parts.join(' '):'');
        let inner=carrier?`<a class="carrier-link" href="${carrier.url}" target="_blank" rel="noopener">${esc(carrier.name)}&nbsp;</a>`:(label?`<span>${esc(label)}&nbsp;</span>`:'');
        inner+=`<span class="carrier-num" onclick="copyTransNo('${esc(pure)}')">${esc(pure)}</span>`;
        transHtml=`<span class="carrier-no blur-no" onclick="this.classList.toggle('show')">${inner}</span>`;
        // 查询单号只显示单号数字，不带 UPS/DHL 等承运商名称
        queryNoHtml=`<span class="carrier-no blur-no" onclick="this.classList.toggle('show')"><span class="carrier-num" onclick="copyTransNo('${esc(pure)}')">${esc(pure)}</span></span>`;
    }
    let html=`<div class="ship-card">
        <div class="ship-head"><span class="status-tag ${statusClass}">${statusText}</span><span class="tip-faint">如轨迹异常，尝试再次查询</span></div>
        <div class="info-row"><span class="info-label">查询单号：</span>${queryNoHtml}</div>
        <div class="info-row"><span class="info-label">转运单号：</span>${transHtml}</div>
        <div class="info-row"><span class="info-label">目的地：</span>${destLine}</div>`;
    // 出现“在17网/官网查询”占位文案时：隐藏原文案，并在轨迹顶部新增可点击的官网查询入口（最新一条）
    if(hadPlaceholder){
        const headTime=realTraces.length?realTraces[0].time:nowTime();
        html+=`<div class="timeline-item track-official" onclick="gotoOfficial('${esc(jumpNo)}')">
            <div class="track-time">${esc(headTime)}</div>
            <div class="track-desc-official">🔗 点击进入查询提取后物流轨迹 ›</div>
        </div>`;
    }
    html+=`<div class="track-preview">`;
    realTraces.slice(0,2).forEach(t=>html+=trackItem(t.time,t.info));
    html+=`</div>`;
    if(realTraces.length>2){
        const open=isSingle;
        html+=`<div class="track-full" id="track-${tid}"${open?' style="display:block;"':''}>`;
        realTraces.slice(2).forEach(t=>html+=trackItem(t.time,t.info));
        html+=`</div><div class="toggle-track" data-target="${tid}">${open?'▲ 收起物流轨迹':'▼ 展开完整物流轨迹'}</div>`;
    }
    if(!realTraces.length&&!hadPlaceholder)html+=`<div style="margin-top:8px;color:#888;font-size:14px;">暂未获取到物流轨迹</div>`;
    if(d.subOrders&&d.subOrders.length){
        html+=`<div style="margin-top:16px;padding-top:12px;border-top:1px dashed #e5e7eb;"><div style="font-size:16px;font-weight:bold;color:#333;margin-bottom:8px;">子单号轨迹</div>`;
        d.subOrders.forEach(sub=>{
            const ss=[...sub.traces].sort((a,b)=>new Date(b.time)-new Date(a.time));
            html+=`<div style="margin-bottom:12px;"><div style="font-size:14px;color:#0074cc;font-weight:bold;margin-bottom:6px;">子单号：${esc(sub.no)}</div>`;
            ss.slice(0,2).forEach(t=>html+=trackItem(t.time,t.info));
            html+=`</div>`;
        });
        html+=`</div>`;
    }
    html+=`</div>`;
    return html;
};
const getHistory=()=>{try{return JSON.parse(localStorage.getItem(CFG.HISTORY_KEY)||'[]');}catch(e){return [];}};
const saveHistory=list=>{if(list.length>CFG.MAX_HISTORY)list.length=CFG.MAX_HISTORY;localStorage.setItem(CFG.HISTORY_KEY,JSON.stringify(list));};
const nowTime=()=>{const d=new Date();return `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
const addHistory=no=>{
    const list=getHistory();
    const i=list.findIndex(x=>x.no===no);
    if(i>-1)list.splice(i,1);
    list.unshift({no,time:nowTime()});
    saveHistory(list);
};
const renderHistory=()=>{
    const list=getHistory();
    if(!list.length){EL.historyListWrap.innerHTML=`<div class="history-empty">暂无历史记录</div>`;return;}
    EL.historyListWrap.innerHTML=list.map(x=>`<div class="history-item" data-no="${esc(x.no)}"><div class="history-time">最近查询：${esc(x.time)}</div><div class="history-no">${esc(x.no)}</div></div>`).join('');
    document.querySelectorAll('.history-item').forEach(row=>{
        row.onclick=function(){EL.orderInput.value=this.dataset.no;closeModal(EL.historyMask);EL.resultBox.style.display='block';EL.queryBtn.click();};
    });
};
const startQuery=async()=>{
    const raw=EL.orderInput.value.trim();
    if(!raw){showToast('请输入单号!');return;}
    const rawList=raw.replace(/[^\da-zA-Z]+/g,'\n').split('\n').map(v=>v.trim().toUpperCase()).filter(v=>v.length>=5);
    for(const item of rawList){if(item.length>18){showToast('单号长度需5-18位，请检查');return;}}
    const unique=[...new Set(rawList)];
    if(!unique.length){showToast('未识别到有效单号');return;}
    if(unique.length>CFG.MAX_ROWS){showToast(`单次最多查询${CFG.MAX_ROWS}个单号`);return;}
    if(querying)return;
    const now=Date.now();
    if(now-lastQuery<CFG.MIN_INTERVAL)return;
    lastQuery=now;
    querying=true;
    abortCtrl=new AbortController();
    window._qcount=unique.length;
    EL.serviceCard.style.display='none';
    $('phoneCard').style.display='none';
    $('contactCard').style.display='none';
    EL.resultBox.style.display='block';
    EL.resultBox.innerHTML=`<div class="loading-tip">🔄 开始查询，共${unique.length}个单号...</div>`;
    let allHtml='',failList=[];
    try{
        for(let i=0;i<unique.length;i++){
            if(abortCtrl.signal.aborted)break;
            const no=unique[i];
            EL.resultBox.innerHTML=`<div class="loading-tip">🔄 正在查询第${i+1}/${unique.length}个：${esc(no)}</div>`;
            const data=await getTrack(no);
            addHistory(no);
            if(data)allHtml+=renderShip(data,no);
            else failList.push(no);
        }
        let title=rawList.length!==unique.length
            ?`<h3>查询结果（输入${rawList.length}个，去重后${unique.length}个单号）</h3>`
            :`<h3>查询结果（总计${unique.length}个单号）</h3>`;
        if(failList.length)title+=`<div style="margin-bottom:12px;color:#333;font-size:14px;"><span style="color:#d03030;">共${failList.length}个单号暂无物流信息：</span>${failList.map(esc).join('、')}</div>`;
        EL.resultBox.innerHTML=title+allHtml;
        EL.orderInput.style.color='#fff';
    }catch(err){
        EL.resultBox.innerHTML=`<div style="padding:20px;color:red;">全局查询异常：${esc(err.message)}</div>`;
    }
    querying=false;
};
const resetAll=()=>{if(abortCtrl)abortCtrl.abort();querying=false;EL.orderInput.value='';EL.orderInput.style.color='';EL.resultBox.style.display='none';EL.serviceCard.style.display='block';$('phoneCard').style.display='block';$('contactCard').style.display='block';showToast('已清空输入单号');};
const init=()=>{
    $('modalQrImg').src=$('qrImg').src;
    $('modalContactInfo').innerHTML='<div>📍 地址：青田县 水南 江南大道58号</div><div>（爱丽斯特公交站 天桥旁）</div><div>📞 电话：<a href="tel:13059665525">130 5966 5525</a></div>';
    $('modalQrDesc').textContent=document.querySelector('#contactCard .qr-desc').textContent;
    $('qrFileImg').onerror=()=>{$('qrFileImg').style.display='none';};
    $('modalQrFileImg').onerror=()=>{$('modalQrFileImg').style.display='none';};
    EL.contactJumpBtn.onclick=()=>openModal(EL.contactMask);
    EL.closeContact.onclick=()=>closeModal(EL.contactMask);
    EL.contactMask.onclick=e=>{if(e.target===EL.contactMask)closeModal(EL.contactMask);};
    EL.closeHistory.onclick=()=>closeModal(EL.historyMask);
    EL.historyMask.onclick=e=>{if(e.target===EL.historyMask)closeModal(EL.historyMask);};
    EL.resetBtn.onclick=resetAll;
    EL.queryBtn.onclick=startQuery;
    EL.historyBtn.onclick=()=>{if(!getHistory().length)return showToast("暂无历史记录");renderHistory();openModal(EL.historyMask);};
    EL.clearAllHistory.onclick=()=>{localStorage.removeItem(CFG.HISTORY_KEY);renderHistory();closeModal(EL.historyMask);showToast('已清空记录');};
    EL.orderInput.addEventListener("keydown",e=>{if(e.key==="Enter")startQuery();});
};
document.addEventListener('click',e=>{
    const btn=e.target.closest('.toggle-track');
    if(!btn)return;
    const dom=document.getElementById('track-'+btn.dataset.target);
    const open=dom.style.display==='block';
    dom.style.display=open?'none':'block';
    btn.innerText=open?'▼ 展开完整物流轨迹':'▲ 收起物流轨迹';
});
window.fillAndSearch=num=>{EL.orderInput.value=num;EL.serviceCard.style.display='none';$('phoneCard').style.display='none';$('contactCard').style.display='none';EL.resultBox.style.display='block';startQuery();};
init();
</script>
